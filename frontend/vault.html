<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evidence Vault — Your saved scans | VeriShield AI</title>
  <meta name="description" content="Your private record of past scans, each with its verdict, findings and SHA-256 fingerprint." />
  <link rel="canonical" href="https://verishield-ai-web.vercel.app/vault" />
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="VeriShield AI" />
  <meta property="og:title" content="Evidence Vault — Your saved scans | VeriShield AI" />
  <meta property="og:description" content="Your private record of past scans, each with its verdict, findings and SHA-256 fingerprint." />
  <meta property="og:url" content="https://verishield-ai-web.vercel.app/vault" />
  <meta property="og:image" content="https://verishield-ai-web.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="VeriShield AI — know what's real before you trust it" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Evidence Vault — Your saved scans | VeriShield AI" />
  <meta name="twitter:description" content="Your private record of past scans, each with its verdict, findings and SHA-256 fingerprint." />
  <meta name="twitter:image" content="https://verishield-ai-web.vercel.app/og-image.png" />
  <meta name="theme-color" content="#090b0f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 5.500 7v8c0 6.300 4.400 11.500 10.500 13.500C22.100 26.500 26.500 21.300 26.500 15V7L16 3Z' fill='%23928fff'/%3E%3Cpath d='m11 15.500 3.600 3.600L21.500 12' stroke='%23090b0f' stroke-width='2.600' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js"></script>
  <script>VS.requireAuth();</script>
</head>
<body>

  <header id="nav"></header>
  <script>VS.mountNav('profile');</script>

  <main class="shell">
    <div class="page-head" style="padding-bottom: 0;">
      <div class="card vault-head">
        <div class="vault-id">
          <span class="avatar avatar--lg" id="avatar">V</span>
          <div>
            <h1>Evidence vault</h1>
            <p><b id="userName"></b> <span id="userEmail"></span></p>
          </div>
        </div>
        <a class="btn btn--primary" href="workbench.html">New scan</a>
      </div>

      <dl class="stats" id="stats" hidden>
        <div class="stat"><dt>Scans logged</dt><dd id="statTotal">0</dd></div>
        <div class="stat" data-tone="danger"><dt>Flagged</dt><dd id="statFlagged">0</dd></div>
        <div class="stat" data-tone="safe"><dt>Clean</dt><dd id="statClean">0</dd></div>
        <div class="stat"><dt>Avg. manipulation confidence</dt><dd id="statAvg">0%</dd></div>
      </dl>
    </div>

    <div class="toolbar" id="toolbar" hidden>
      <h2>Scan ledger</h2>
      <div class="segmented" role="group" aria-label="Filter scans">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="flagged" aria-pressed="false">Flagged</button>
        <button type="button" data-filter="unverified" aria-pressed="false">Unverified</button>
        <button type="button" data-filter="clean" aria-pressed="false">Clean</button>
      </div>
      <div class="search">
        <label class="sr-only" for="searchInput">Search scans</label>
        <span id="searchIcon"></span>
        <input class="input" id="searchInput" type="search" placeholder="Search name or hash" autocomplete="off" />
      </div>
    </div>

    <div class="ledger" id="ledger" aria-live="polite" style="margin-top: 28px;">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </main>

  <footer id="footer"></footer>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const esc = VS.esc;
      const TYPE_ICONS = { pdf: 'file', image: 'image', video: 'video', text: 'text' };

      let scans = [];
      let filter = 'all';
      let query = '';

      $('searchIcon').outerHTML = VS.icon('search');

      /* ---------- Account ---------- */

      function paintUser(user) {
        if (!user) return;
        $('avatar').textContent = VS.initials(user);
        $('userName').textContent = user.name || '';
        $('userEmail').textContent = user.email || '';
      }

      paintUser(VS.getUser());
      VS.api('/auth/profile')
        .then((data) => paintUser(data && (data.user || data)))
        .catch(() => { /* stored details are already shown */ });

      /* ---------- Ledger ---------- */

      function message(title, text, action) {
        $('ledger').innerHTML = `
          <div class="card empty" style="min-height: 280px;">
            <div>
              <svg class="empty__art" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="10" y="14" width="60" height="52" rx="8"/><circle cx="40" cy="40" r="10"/><path d="M40 30v-5M40 55v-5M22 66v5M58 66v5"/></svg>
              <h3>${esc(title)}</h3>
              <p>${esc(text)}</p>
              ${action || ''}
            </div>
          </div>`;
      }

      function entryHTML(s) {
        const list = (items) => items.map((t) => `<li>${esc(t)}</li>`).join('');
        const findings = s.artifacts.filter((a) => !/^SHA-256/i.test(a));
        return `
          <details class="entry" data-tone="${s.tone}">
            <summary>
              <span class="entry__bar"></span>
              <div style="min-width: 0;">
                <div class="entry__name">${esc(s.name)}</div>
                <div class="entry__meta">
                  <span>${esc(s.type.toUpperCase())}</span>
                  ${s.date ? `<span>${esc(VS.formatDate(s.date))}</span>` : ''}
                  ${s.hash ? `<span>${esc(s.hash.slice(0, 12))}…</span>` : ''}
                </div>
              </div>
              <span class="chip" data-tone="${s.tone}">${s.label}</span>
              <div class="entry__nums">
                <div><b>${esc(s.ai)}%</b><span>Manipulation</span></div>
                <div><b>${esc(s.harm)}%</b><span>Harm risk</span></div>
              </div>
              ${VS.icon('chevron', 'entry__chev')}
            </summary>
            <div class="entry__body">
              <div class="block">
                <div class="eyebrow block__title">Summary</div>
                <p style="font-size: 14px;">${esc(s.summary)}</p>
              </div>
              ${findings.length ? `<div class="block"><div class="eyebrow block__title">Findings</div><ul class="findings">${list(findings)}</ul></div>` : ''}
              ${s.actions.length ? `<div class="block"><div class="eyebrow block__title">Recommended next steps</div><ul class="findings">${list(s.actions)}</ul></div>` : ''}
              ${s.hash ? `<div class="block"><div class="eyebrow block__title">SHA-256 fingerprint</div>
                <div class="hash"><code>${esc(s.hash)}</code><button class="icon-btn" type="button" data-copy="${esc(s.hash)}" aria-label="Copy fingerprint">${VS.icon('copy')}</button></div></div>` : ''}
            </div>
          </details>`;
      }

      function paint() {
        const q = query.toLowerCase();
        const visible = scans.filter((s) =>
          (filter === 'all' || filter === s.label.toLowerCase()) &&
          (!q || s.name.toLowerCase().includes(q) || s.hash.toLowerCase().includes(q))
        );

        if (!visible.length) {
          return message('No scans match', 'Try a different filter or search term.');
        }
        $('ledger').innerHTML = visible.map(entryHTML).join('');
      }

      async function load() {
        $('ledger').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
        try {
          const data = await VS.api('/scan/history');
          const list = Array.isArray(data) ? data : (data.scans || data.history || data.data || []);
          scans = list.map(VS.readScan).sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
        } catch (err) {
          $('stats').hidden = true;
          $('toolbar').hidden = true;
          message("Couldn't load your vault", err.message, '<button class="btn btn--ghost" type="button" id="retry" style="margin-top: 18px;">Try again</button>');
          const retry = $('retry');
          if (retry) retry.addEventListener('click', load);
          return;
        }

        if (!scans.length) {
          return message('Your vault is empty', 'Scans you run in the workbench are saved here with their fingerprint.',
            '<a class="btn btn--primary" href="workbench.html" style="margin-top: 18px;">Run your first scan</a>');
        }

        const flagged = scans.filter((s) => s.flagged).length;
        $('statTotal').textContent = scans.length;
        $('statFlagged').textContent = flagged;
        $('statClean').textContent = scans.filter((s) => s.tone === 'safe').length;
        $('statAvg').textContent = `${Math.round(scans.reduce((sum, s) => sum + Number(s.ai || 0), 0) / scans.length)}%`;
        $('stats').hidden = false;
        $('toolbar').hidden = false;
        $('ledger').style.marginTop = '0';
        paint();
      }

      document.querySelectorAll('[data-filter]').forEach((btn) => {
        btn.addEventListener('click', () => {
          filter = btn.dataset.filter;
          document.querySelectorAll('[data-filter]').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
          paint();
        });
      });

      $('searchInput').addEventListener('input', (e) => { query = e.target.value.trim(); paint(); });

      $('ledger').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-copy]');
        if (btn) VS.copy(btn.dataset.copy, 'Fingerprint copied');
      });

      load();
    })();
  </script>
</body>
</html>
