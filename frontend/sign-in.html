<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in or create an account | VeriShield AI</title>
  <meta name="description" content="Sign in to VeriShield AI to scan files and keep every verdict in your evidence vault." />
  <link rel="canonical" href="https://verishield-ai-web.vercel.app/sign-in" />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="VeriShield AI" />
  <meta property="og:title" content="Sign in or create an account | VeriShield AI" />
  <meta property="og:description" content="Sign in to VeriShield AI to scan files and keep every verdict in your evidence vault." />
  <meta property="og:url" content="https://verishield-ai-web.vercel.app/sign-in" />
  <meta property="og:image" content="https://verishield-ai-web.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="VeriShield AI — know what's real before you trust it" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sign in or create an account | VeriShield AI" />
  <meta name="twitter:description" content="Sign in to VeriShield AI to scan files and keep every verdict in your evidence vault." />
  <meta name="twitter:image" content="https://verishield-ai-web.vercel.app/og-image.png" />
  <meta name="theme-color" content="#090b0f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 5.500 7v8c0 6.300 4.400 11.500 10.500 13.500C22.100 26.500 26.500 21.300 26.500 15V7L16 3Z' fill='%23928fff'/%3E%3Cpath d='m11 15.500 3.600 3.600L21.500 12' stroke='%23090b0f' stroke-width='2.600' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js"></script>
  <script>
    // Only same-site page names are accepted as a post-login destination.
    function nextPage() {
      const next = new URLSearchParams(location.search).get('next') || '';
      return /^[a-z-]+(\.html)?(\?[^#]*)?$/i.test(next) ? next : 'workbench.html';
    }
    if (VS.getToken()) location.replace(nextPage());
  </script>
</head>
<body>

  <div class="auth">
    <aside class="auth__aside">
      <a class="brand" href="index.html" id="asideBrand"></a>
      <div>
        <p class="auth__headline">Your evidence, <span class="serif">on the record</span>.</p>
        <ul class="auth__points" id="authPoints"></ul>
      </div>
      <span class="eyebrow">Verdicts are heuristic indicators, not legal proof</span>
    </aside>

    <main class="auth__main">
      <div class="auth__panel">
        <a class="brand auth__mobile-brand" href="index.html" id="mobileBrand"></a>

        <h1 id="authTitle">Welcome back</h1>
        <p id="authSub">Sign in to open your workbench and vault.</p>

        <form class="auth__form" id="authForm" novalidate>
          <div class="segmented" role="tablist" aria-label="Account action" style="margin-bottom: 22px;">
            <button type="button" role="tab" id="tabLogin" aria-selected="true">Sign in</button>
            <button type="button" role="tab" id="tabRegister" aria-selected="false">Create account</button>
          </div>

          <div class="notice" id="authError" role="alert" hidden style="margin-bottom: 18px;"></div>

          <label class="field" id="nameField" hidden>
            <span class="label">Full name</span>
            <input class="input" id="nameInput" type="text" autocomplete="name" placeholder="Your name" />
          </label>

          <label class="field">
            <span class="label">Email address</span>
            <input class="input" id="emailInput" type="email" autocomplete="email" placeholder="you@example.com" required />
          </label>

          <div class="field">
            <label class="label" for="passwordInput">Password</label>
            <div class="input-wrap">
              <input class="input" id="passwordInput" type="password" autocomplete="current-password" placeholder="Enter your password" required />
              <button class="icon-btn" type="button" id="togglePassword" aria-label="Show password" aria-pressed="false"></button>
            </div>
            <p class="hint" id="passwordHint" hidden>Use at least 8 characters.</p>
          </div>

          <button class="btn btn--primary btn--lg btn--block" id="submitBtn" type="submit" style="margin-top: 24px;">Sign in</button>
        </form>

        <p class="auth__foot">Just want to check a link? <a href="url-check.html">URL Intel needs no account</a></p>
      </div>
    </main>
  </div>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const brand = `${VS.LOGO}<span>VeriShield <em>AI</em></span>`;
      $('asideBrand').innerHTML = brand;
      $('mobileBrand').innerHTML = brand;

      $('authPoints').innerHTML = [
        'Scan images, video, PDFs and text for signs of tampering',
        'Every verdict is saved with a SHA-256 fingerprint',
        'Download a PDF evidence certificate for any scan'
      ].map((t) => `<li>${VS.icon('check')}<span>${t}</span></li>`).join('');

      const errorBox = $('authError');
      const submitBtn = $('submitBtn');
      let mode = 'login';

      function showError(message) {
        errorBox.innerHTML = `${VS.icon('alert')}<span>${VS.esc(message)}</span>`;
        errorBox.dataset.tone = '';
        errorBox.hidden = false;
      }

      function setMode(next) {
        mode = next === 'register' ? 'register' : 'login';
        const reg = mode === 'register';
        $('tabLogin').setAttribute('aria-selected', String(!reg));
        $('tabRegister').setAttribute('aria-selected', String(reg));
        $('nameField').hidden = !reg;
        $('passwordHint').hidden = !reg;
        $('passwordInput').autocomplete = reg ? 'new-password' : 'current-password';
        $('passwordInput').placeholder = reg ? 'Create a password' : 'Enter your password';
        $('authTitle').textContent = reg ? 'Create your account' : 'Welcome back';
        $('authSub').textContent = reg
          ? 'Free to use. Your scans are saved to a private vault.'
          : 'Sign in to open your workbench and vault.';
        submitBtn.textContent = reg ? 'Create account' : 'Sign in';
        errorBox.hidden = true;
      }

      $('tabLogin').addEventListener('click', () => setMode('login'));
      $('tabRegister').addEventListener('click', () => setMode('register'));

      // Password visibility
      const toggle = $('togglePassword');
      const paintToggle = (shown) => {
        toggle.innerHTML = VS.icon(shown ? 'eyeOff' : 'eye');
        toggle.setAttribute('aria-label', shown ? 'Hide password' : 'Show password');
        toggle.setAttribute('aria-pressed', String(shown));
      };
      paintToggle(false);
      toggle.addEventListener('click', () => {
        const input = $('passwordInput');
        const shown = input.type === 'password';
        input.type = shown ? 'text' : 'password';
        paintToggle(shown);
      });

      $('authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = $('nameInput').value.trim();
        const email = $('emailInput').value.trim();
        const password = $('passwordInput').value;
        const reg = mode === 'register';

        if (reg && !name) return showError('Enter your name to create an account.');
        if (!/^\S+@\S+\.\S+$/.test(email)) return showError('Enter a valid email address.');
        if (!password) return showError('Enter your password.');
        if (reg && password.length < 8) return showError('Choose a password with at least 8 characters.');

        errorBox.hidden = true;
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="spinner"></span>${reg ? 'Creating account…' : 'Signing in…'}`;

        try {
          const data = await VS.api(reg ? '/auth/register' : '/auth/login', {
            method: 'POST',
            body: reg ? { name, email, password } : { email, password }
          });
          if (!data || !data.token) throw new Error('The server did not return a session. Try again.');
          VS.setSession(data.token, data.user || { name: data.name, email: data.email });
          location.replace(nextPage());
        } catch (err) {
          showError(err.message);
          submitBtn.disabled = false;
          submitBtn.textContent = reg ? 'Create account' : 'Sign in';
        }
      });

      setMode(new URLSearchParams(location.search).get('mode'));

      // Message handed over by a redirect (e.g. expired session).
      try {
        const flash = sessionStorage.getItem('verishield_flash');
        if (flash) {
          sessionStorage.removeItem('verishield_flash');
          errorBox.innerHTML = `${VS.icon('alert')}<span>${VS.esc(flash)}</span>`;
          errorBox.dataset.tone = 'accent';
          errorBox.hidden = false;
        }
      } catch (e) { /* storage blocked */ }
    })();
  </script>
</body>
</html>
